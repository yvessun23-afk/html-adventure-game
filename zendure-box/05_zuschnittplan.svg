<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 2080" width="1250" height="2080"><title>Zuschnittplan Zendure Winterbox</title>
<defs>
  <pattern id="xps" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="8" fill="#cfe8f7"/><line x1="0" y1="0" x2="0" y2="8" stroke="#4f97cc" stroke-width="1.3"/>
  </pattern>
  <pattern id="foam" width="6" height="6" patternUnits="userSpaceOnUse">
    <rect width="6" height="6" fill="#e6f2fa"/><circle cx="2" cy="2" r="0.7" fill="#9cc3de"/><circle cx="5" cy="5" r="0.7" fill="#9cc3de"/>
  </pattern>
  <pattern id="ground" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <line x1="0" y1="0" x2="0" y2="8" stroke="#777" stroke-width="1"/>
  </pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#0a7bd1"/></marker>
  <marker id="arrw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#d1400a"/></marker>
  <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,1 L10,5 L0,9 z" fill="#1d2b36"/></marker>
</defs>
<style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#111}
  .t{font-size:13px} .s{font-size:11px} .h{font-size:20px;font-weight:bold}
  .b{font-weight:bold}
</style>
<rect width="100%" height="100%" fill="#ffffff"/><text x="20.0" y="32.0" class="h" text-anchor="start">5  ZUSCHNITTPLAN - 5 Platten XPS 1250 x 600 x 30 mm</text><text x="20.0" y="52.0" class="s" text-anchor="start">Alle Teile mit Cuttermesser + Lineal (mehrfach anritzen, brechen) oder Fuchsschwanz/Stichsäge zuschneiden.</text><rect x="20.0" y="80.0" width="687.5" height="330.0" fill="#f4f8fb" stroke="#1d2b36" stroke-width="1.5" /><text x="30.0" y="94.0" class="s b" text-anchor="start">Platte 1</text><rect x="20.0" y="80.0" width="511.5" height="286.0" fill="url(#foam)" stroke="#1d2b36" stroke-width="1.2" /><rect x="20.0" y="113.0" width="38.5" height="44.0" fill="#ffe9e6" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/><text x="39.2" y="138.0" class="s" text-anchor="middle" fill="#c0392b">80x70</text><rect x="20.0" y="289.0" width="38.5" height="44.0" fill="#ffe9e6" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/><text x="39.2" y="314.0" class="s" text-anchor="middle" fill="#c0392b">80x70</text><rect x="498.5" y="195.5" width="33.0" height="55.0" fill="#ffe9e6" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/><text x="515.0" y="226.0" class="s" text-anchor="middle" fill="#c0392b">100x60</text><rect x="432.5" y="212.0" width="22.0" height="22.0" fill="#2b3a46" stroke="#000" stroke-width="1" /><text x="443.5" y="227.0" class="s" text-anchor="middle" fill="#fff">S</text><text x="275.8" y="217.0" class="t b" text-anchor="middle">Rückwand</text><text x="275.8" y="235.0" class="s" text-anchor="middle">930 x 520</text><text x="537.0" y="113.0" class="s" text-anchor="start">Rest 320x600</text><rect x="20.0" y="460.0" width="687.5" height="330.0" fill="#f4f8fb" stroke="#1d2b36" stroke-width="1.5" /><text x="30.0" y="474.0" class="s b" text-anchor="start">Platte 2</text><rect x="20.0" y="460.0" width="511.5" height="286.0" fill="url(#foam)" stroke="#1d2b36" stroke-width="1.2" /><text x="275.8" y="597.0" class="t b" text-anchor="middle">Vorderwand</text><text x="275.8" y="615.0" class="s" text-anchor="middle">930 x 520</text><rect x="20.0" y="840.0" width="687.5" height="330.0" fill="#f4f8fb" stroke="#1d2b36" stroke-width="1.5" /><text x="30.0" y="854.0" class="s b" text-anchor="start">Platte 3</text><rect x="20.0" y="840.0" width="511.5" height="198.0" fill="url(#foam)" stroke="#1d2b36" stroke-width="1.2" /><rect x="47.5" y="906.0" width="66.6" height="66.6" fill="#2b3a46" stroke="#000" stroke-width="1" /><text x="80.8" y="943.3" class="s" text-anchor="middle" fill="#fff">121x121</text><text x="275.8" y="933.0" class="t b" text-anchor="middle">Linke Wand</text><text x="275.8" y="951.0" class="s" text-anchor="middle">930 x 360</text><text x="25.0" y="1060.0" class="s" text-anchor="start">Rest 930x240: Reserve</text><rect x="20.0" y="1220.0" width="687.5" height="330.0" fill="#f4f8fb" stroke="#1d2b36" stroke-width="1.5" /><text x="30.0" y="1234.0" class="s b" text-anchor="start">Platte 4</text><rect x="20.0" y="1220.0" width="511.5" height="198.0" fill="url(#foam)" stroke="#1d2b36" stroke-width="1.2" /><rect x="421.5" y="1286.0" width="66.6" height="66.6" fill="#2b3a46" stroke="#000" stroke-width="1" /><text x="454.8" y="1323.3" class="s" text-anchor="middle" fill="#fff">121x121</text><text x="275.8" y="1313.0" class="t b" text-anchor="middle">Rechte Wand</text><text x="275.8" y="1331.0" class="s" text-anchor="middle">930 x 360</text><rect x="20.0" y="1600.0" width="687.5" height="330.0" fill="#f4f8fb" stroke="#1d2b36" stroke-width="1.5" /><text x="30.0" y="1614.0" class="s b" text-anchor="start">Platte 5</text><rect x="20.0" y="1600.0" width="286.0" height="231.0" fill="url(#foam)" stroke="#1d2b36" stroke-width="1.2" /><text x="163.0" y="1709.5" class="t b" text-anchor="middle">Deckelplatte</text><text x="163.0" y="1727.5" class="s" text-anchor="middle">520 x 420</text><rect x="311.5" y="1600.0" width="251.9" height="196.9" fill="url(#foam)" stroke="#1d2b36" stroke-width="1.2" /><rect x="409.9" y="1600.0" width="55.0" height="13.8" fill="#ffe9e6" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/><text x="437.5" y="1609.9" class="s" text-anchor="middle" fill="#c0392b">100x25</text><text x="437.5" y="1692.5" class="t b" text-anchor="middle">Deckel-Stopfen</text><text x="437.5" y="1710.5" class="s" text-anchor="middle">458 x 358</text><rect x="20.0" y="1833.8" width="251.9" height="96.3" fill="url(#foam)" stroke="#1d2b36" stroke-width="1.2" /><text x="146.0" y="1875.9" class="t b" text-anchor="middle">Boden Hälfte 1</text><text x="146.0" y="1893.9" class="s" text-anchor="middle">458 x 175</text><rect x="275.8" y="1833.8" width="251.9" height="96.3" fill="url(#foam)" stroke="#1d2b36" stroke-width="1.2" /><text x="401.7" y="1875.9" class="t b" text-anchor="middle">Boden Hälfte 2</text><text x="401.7" y="1893.9" class="s" text-anchor="middle">458 x 175</text><text x="567.2" y="1655.0" class="s" text-anchor="start">Die zwei Boden-Hälften nebeneinander</text><text x="567.2" y="1664.9" class="s" text-anchor="start">legen und mit Alu-Klebeband verbinden.</text><text x="740.0" y="110.0" class="t b" text-anchor="start">Hinweise</text><text x="740.0" y="132.0" class="s" text-anchor="start">Maße = Wandhöhe 930 | Wandbreiten 520 (vorn/hinten), 360 (Seiten).</text><text x="740.0" y="154.0" class="s" text-anchor="start">Plattenlänge 1250: Wandhöhe liegt entlang der Länge.</text><text x="740.0" y="176.0" class="s" text-anchor="start">Rot gestrichelt = Ausschnitt (Nut am Plattenrand).</text><text x="740.0" y="198.0" class="s" text-anchor="start">Dunkel = Loch / Tasche: Lüfter 121x121 (durchgehend),</text><text x="740.0" y="220.0" class="s" text-anchor="start">S = Sensortasche 40x40 nur 12 mm tief (nicht durchschneiden!).</text><text x="740.0" y="242.0" class="s" text-anchor="start">Lüfteröffnungen: Mitte 180 mm von der Vorderkante der Seitenwand.</text><text x="740.0" y="264.0" class="s" text-anchor="start">Zuluft-Mitte 110 mm über Boden, Abluft-Mitte 790 mm.</text><text x="740.0" y="286.0" class="s" text-anchor="start">Lüfter-Kabeldurchführung: Ø 6 mm neben der Öffnung bohren.</text><text x="740.0" y="308.0" class="s" text-anchor="start">Stopfen 2 mm kleiner als Innenmaß (1 mm Spiel je Seite).</text><text x="740.0" y="330.0" class="s" text-anchor="start">Bodenplatte darf ~8 mm kürzer sein (Plattenbreite reicht knapp).</text><text x="740.0" y="352.0" class="s" text-anchor="start">Erst nachmessen, dann schneiden: Maße von Hyper/AB2000X</text><text x="740.0" y="374.0" class="s" text-anchor="start">in build_drawings.py oben anpassen -> neu generieren.</text><rect x="10.0" y="2018.0" width="1230.0" height="52.0" fill="none" stroke="#1d2b36" stroke-width="1.5" /><line x1="1040.0" y1="2018.0" x2="1040.0" y2="2070.0" stroke="#1d2b36" stroke-width="1"/><text x="20.0" y="2040.0" class="h" text-anchor="start">05 Zuschnittplan</text><text x="20.0" y="2060.0" class="s" text-anchor="start">5 Platten XPS 1250x600x30 - M 0.55:1</text><text x="1050.0" y="2038.0" class="t b" text-anchor="start">Zendure Winterbox</text><text x="1050.0" y="2054.0" class="s" text-anchor="start">Blatt 5/5 - Masse in mm</text><text x="1050.0" y="2066.0" class="s" text-anchor="start">XPS 30 mm | Massstab siehe Zeichnung</text></svg>