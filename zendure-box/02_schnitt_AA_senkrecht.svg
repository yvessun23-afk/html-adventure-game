</style>
<rect width="100%" height="100%" fill="#ffffff"/><text x="20.0" y="32.0" class="h" text-anchor="start">2  SCHNITT A-A (senkrecht, durch beide Lüfter) - Isolierung und Luftführung</text><text x="20.0" y="52.0" class="s" text-anchor="start">Blick von vorn auf Schnittebene y = 210 mm. Schraffur = XPS-Dämmung 30 mm.</text><rect x="190.8" y="830.0" width="624.0" height="18.0" fill="url(#ground)" stroke="#777" stroke-width="1" /><line x1="190.8" y1="830.0" x2="814.8" y2="830.0" stroke="#1d2b36" stroke-width="1.6"/><rect x="300.0" y="791.0" width="23.4" height="39.0" fill="url(#xps)" stroke="#1d2b36" stroke-width="1.2" /><rect x="300.0" y="104.6" width="23.4" height="592.8" fill="url(#xps)" stroke="#1d2b36" stroke-width="1.2" /><rect x="682.2" y="260.6" width="23.4" height="569.4" fill="url(#xps)" stroke="#1d2b36" stroke-width="1.2" /><rect x="682.2" y="104.6" width="23.4" height="62.4" fill="url(#xps)" stroke="#1d2b36" stroke-width="1.2" /><rect x="323.4" y="806.6" width="358.8" height="23.4" fill="url(#xps)" stroke="#1d2b36" stroke-width="1.2" /><rect x="324.2" y="104.6" width="357.2" height="23.4" fill="url(#xps)" stroke="#1d2b36" stroke-width="1.2" /><rect x="300.0" y="81.2" width="405.6" height="23.4" fill="url(#xps)" stroke="#1d2b36" stroke-width="1.2" /><rect x="362.4" y="650.6" width="280.8" height="154.4" fill="#d4d9de" stroke="#555" stroke-width="1" /><text x="502.8" y="732.6" class="t" text-anchor="middle">AB2000X #3</text><rect x="362.4" y="494.6" width="280.8" height="154.4" fill="#d4d9de" stroke="#555" stroke-width="1" /><text x="502.8" y="576.6" class="t" text-anchor="middle">AB2000X #2</text><rect x="362.4" y="338.6" width="280.8" height="154.4" fill="#d4d9de" stroke="#555" stroke-width="1" /><text x="502.8" y="420.6" class="t" text-anchor="middle">AB2000X #1</text><rect x="362.4" y="182.6" width="280.8" height="156.0" fill="#f6d9b8" stroke="#7a5a34" stroke-width="1" /><text x="502.8" y="264.6" class="t b" text-anchor="middle">Hyper 2000</text><rect x="300.0" y="697.4" width="19.5" height="93.6" fill="#3a4652" stroke="#111" stroke-width="1" /><line x1="309.4" y1="703.6" x2="309.4" y2="784.8" stroke="#9db3c5" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="686.1" y="167.0" width="19.5" height="93.6" fill="#3a4652" stroke="#111" stroke-width="1" /><line x1="695.5" y1="173.2" x2="695.5" y2="254.4" stroke="#9db3c5" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="294.5" y="685.7" width="5.5" height="117.0" fill="#b03a2e" stroke="#7b241c" stroke-width="1" /><rect x="705.6" y="155.3" width="5.5" height="117.0" fill="#b03a2e" stroke="#7b241c" stroke-width="1" /><polyline points="229.8,744.2 342.9,744.2 342.9,151.4 662.7,151.4 662.7,213.8 775.8,213.8" fill="none" stroke="#0a7bd1" stroke-width="3" stroke-linejoin="round" stroke-dasharray="9 6" marker-end="url(#arr)"/><text x="222.0" y="732.2" class="t b" text-anchor="end" fill="#0a7bd1">Zuluft</text><text x="777.4" y="201.8" class="t b" text-anchor="start" fill="#d1400a">Abluft</text><line x1="300.0" y1="890.0" x2="705.6" y2="890.0" stroke="#1d2b36" stroke-width="1"/><line x1="300.0" y1="890.0" x2="705.6" y2="890.0" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="502.8" y="886.0" class="s" text-anchor="middle">520 außen</text><line x1="323.4" y1="916.0" x2="682.2" y2="916.0" stroke="#1d2b36" stroke-width="1"/><line x1="323.4" y1="916.0" x2="682.2" y2="916.0" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="502.8" y="912.0" class="s" text-anchor="middle">460 innen</text><line x1="323.4" y1="596.0" x2="362.4" y2="596.0" stroke="#1d2b36" stroke-width="1"/><line x1="323.4" y1="596.0" x2="362.4" y2="596.0" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="342.9" y="592.0" class="s" text-anchor="middle">50</text><line x1="643.2" y1="596.0" x2="682.2" y2="596.0" stroke="#1d2b36" stroke-width="1"/><line x1="643.2" y1="596.0" x2="682.2" y2="596.0" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="662.7" y="592.0" class="s" text-anchor="middle">50</text><line x1="855.6" y1="830.0" x2="855.6" y2="81.2" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="851.6" y="455.6" class="s" text-anchor="middle" transform="rotate(-90 851.6 455.6)">960</text><line x1="253.2" y1="830.0" x2="253.2" y2="104.6" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="249.2" y="467.3" class="s" text-anchor="middle" transform="rotate(-90 249.2 467.3)">930</text><line x1="663.2" y1="182.6" x2="663.2" y2="128.0" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="659.2" y="155.3" class="s" text-anchor="middle" transform="rotate(-90 659.2 155.3)">70</text><line x1="815.6" y1="182.6" x2="815.6" y2="806.6" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="811.6" y="494.6" class="s" text-anchor="middle" transform="rotate(-90 811.6 494.6)">800</text><line x1="225.9" y1="830.0" x2="225.9" y2="744.2" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="221.9" y="787.1" class="s" text-anchor="middle" transform="rotate(-90 221.9 787.1)">110</text><line x1="765.6" y1="213.8" x2="765.6" y2="104.6" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="761.6" y="159.2" class="s" text-anchor="middle" transform="rotate(-90 761.6 159.2)">140</text><text x="327.3" y="822.3" class="s" text-anchor="start">Boden 30</text><circle cx="288.3" cy="666.2" r="10" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="288.3" y="670.2" class="s b" text-anchor="middle" fill="#c0392b">3</text><circle cx="719.6" cy="135.8" r="10" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="719.6" y="139.8" class="s b" text-anchor="middle" fill="#c0392b">4</text><circle cx="502.8" cy="114.0" r="10" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="502.8" y="118.0" class="s b" text-anchor="middle" fill="#c0392b">9</text><circle cx="502.8" cy="92.9" r="10" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="502.8" y="96.9" class="s b" text-anchor="middle" fill="#c0392b">10</text><circle cx="311.7" cy="440.0" r="10" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="311.7" y="444.0" class="s b" text-anchor="middle" fill="#c0392b">W</text><circle cx="502.8" cy="818.3" r="10" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="502.8" y="822.3" class="s b" text-anchor="middle" fill="#c0392b">5</text><text x="900.0" y="100.0" class="t b" text-anchor="start">Legende</text><circle cx="910.0" cy="130.0" r="10" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="910.0" y="134.0" class="s b" text-anchor="middle" fill="#c0392b">W</text><text x="928.0" y="134.0" class="s" text-anchor="start">Wand XPS 30 mm (Dämmung, geschnitten)</text><circle cx="910.0" cy="160.0" r="10" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="910.0" y="164.0" class="s b" text-anchor="middle" fill="#c0392b">3</text><text x="928.0" y="164.0" class="s" text-anchor="start">Zuluft-Lüfter 120x120x25, Öffnung 121x121, Gitter 150x150 außen</text><circle cx="910.0" cy="190.0" r="10" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="910.0" y="194.0" class="s b" text-anchor="middle" fill="#c0392b">4</text><text x="928.0" y="194.0" class="s" text-anchor="start">Abluft-Lüfter 120x120x25, Öffnung 121x121, Gitter 150x150 außen</text><circle cx="910.0" cy="220.0" r="10" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="910.0" y="224.0" class="s b" text-anchor="middle" fill="#c0392b">5</text><text x="928.0" y="224.0" class="s" text-anchor="start">Bodenplatte XPS 30 - Stapel steht darauf (Druck ca. 8 kPa, unkritisch)</text><circle cx="910.0" cy="250.0" r="10" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="910.0" y="254.0" class="s b" text-anchor="middle" fill="#c0392b">9</text><text x="928.0" y="254.0" class="s" text-anchor="start">Deckel-Stopfen 30 mm: sitzt 1 mm Spiel im Wandring, schließt Luftspalt oben</text><circle cx="910.0" cy="280.0" r="10" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="910.0" y="284.0" class="s b" text-anchor="middle" fill="#c0392b">10</text><text x="928.0" y="284.0" class="s" text-anchor="start">Deckelplatte 30 mm, 30 mm Überstand rundum (gegen Regen/Spritzwasser)</text><text x="900.0" y="400.0" class="t b" text-anchor="start">Luftführung (Querstrom):</text><text x="900.0" y="420.0" class="s" text-anchor="start">- Zuluft tritt unten links ein, steigt im 50-mm-Spalt auf,</text><text x="900.0" y="440.0" class="s" text-anchor="start">  streicht über den Hyper (70 mm freier Raum oben)</text><text x="900.0" y="460.0" class="s" text-anchor="start">  und verlässt die Box rechts oben. Warme Luft steigt -> Kamineffekt hilft.</text><text x="900.0" y="480.0" class="s" text-anchor="start">- Lüfter-Ebenen bewusst diagonal gegenüber: kein Kurzschlussstrom.</text><text x="900.0" y="500.0" class="s" text-anchor="start">- Luftspalt 50 mm ist das Minimum, mehr (z. B. 70) ist besser.</text><text x="900.0" y="520.0" class="s" text-anchor="start">- Hyper-Höhe liegt auf Abluft-Niveau: Abwärme wird direkt abgeführt.</text><rect x="10.0" y="938.0" width="1300.0" height="52.0" fill="none" stroke="#1d2b36" stroke-width="1.5" /><line x1="1110.0" y1="938.0" x2="1110.0" y2="990.0" stroke="#1d2b36" stroke-width="1"/><text x="20.0" y="960.0" class="h" text-anchor="start">02 Schnitt A-A</text><text x="20.0" y="980.0" class="s" text-anchor="start">Vertikalschnitt durch Zuluft- und Abluftlüfter, M ca. 1:1.3</text><text x="1120.0" y="958.0" class="t b" text-anchor="start">Zendure Winterbox</text><text x="1120.0" y="974.0" class="s" text-anchor="start">Blatt 2/5 - Masse in mm</text><text x="1120.0" y="986.0" class="s" text-anchor="start">XPS 30 mm | Massstab siehe Zeichnung</text></svg>