<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1150" width="1300" height="1150"><title>Details Zendure Winterbox</title>
<defs>
  <pattern id="xps" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="8" fill="#cfe8f7"/><line x1="0" y1="0" x2="0" y2="8" stroke="#4f97cc" stroke-width="1.3"/>
  </pattern>
  <pattern id="foam" width="6" height="6" patternUnits="userSpaceOnUse">
    <rect width="6" height="6" fill="#e6f2fa"/><circle cx="2" cy="2" r="0.7" fill="#9cc3de"/><circle cx="5" cy="5" r="0.7" fill="#9cc3de"/>
  </pattern>
  <pattern id="ground" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <line x1="0" y1="0" x2="0" y2="8" stroke="#777" stroke-width="1"/>
  </pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#0a7bd1"/></marker>
  <marker id="arrw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#d1400a"/></marker>
  <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,1 L10,5 L0,9 z" fill="#1d2b36"/></marker>
</defs>
<style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#111}
  .t{font-size:13px} .s{font-size:11px} .h{font-size:20px;font-weight:bold}
  .b{font-weight:bold}
</style>
<rect width="100%" height="100%" fill="#ffffff"/><text x="20.0" y="32.0" class="h" text-anchor="start">4  DETAILS - Lüfter-Einbau, Kabelschlitze, Ecke, Deckel</text><text x="30.0" y="75.0" class="t b" text-anchor="start">D  Lüfter-Einbau (Schnitt, ca. 1.6:1)</text><rect x="110.0" y="131.0" width="48.0" height="46.4" fill="url(#xps)" stroke="#1d2b36" stroke-width="1.2" /><rect x="110.0" y="372.6" width="48.0" height="46.4" fill="url(#xps)" stroke="#1d2b36" stroke-width="1.2" /><rect x="110.0" y="179.0" width="40.0" height="192.0" fill="#3a4652" stroke="#111" stroke-width="1.2" /><rect x="98.8" y="155.0" width="11.2" height="240.0" fill="#b03a2e" stroke="#7b241c" stroke-width="1" /><rect x="150.0" y="177.4" width="8.0" height="195.2" fill="#c8c8c8" stroke="#555" stroke-width="1" /><line x1="46.0" y1="275.0" x2="97.2" y2="275.0" stroke="#0a7bd1" stroke-width="3" marker-end="url(#arr)"/><text x="38.0" y="267.0" class="s" text-anchor="end">Außen</text><text x="174.0" y="395.0" class="s" text-anchor="start">Innen (Luftspalt)</text><line x1="134.0" y1="139.0" x2="254.0" y2="105.0" stroke="#c0392b" stroke-width="1"/><text x="260.0" y="109.0" class="s" text-anchor="start">XPS 30 mm (schraffiert)</text><line x1="105.2" y1="163.0" x2="254.0" y2="135.0" stroke="#c0392b" stroke-width="1"/><text x="260.0" y="139.0" class="s" text-anchor="start">Lüftungsgitter 150x150, außen mit XPS-tauglichem Kleber</text><line x1="129.2" y1="243.0" x2="254.0" y2="175.0" stroke="#c0392b" stroke-width="1"/><text x="260.0" y="179.0" class="s" text-anchor="start">Lüfter 120x120x25 - Presspassung in Öffnung 121x121</text><line x1="153.2" y1="323.0" x2="254.0" y2="215.0" stroke="#c0392b" stroke-width="1"/><text x="260.0" y="219.0" class="s" text-anchor="start">Alu-Klebeband innen rundum (Fixierung + Dichtung)</text><text x="30.0" y="430.0" class="s" text-anchor="start">Lüfterkabel (2 Adern) durch Ø 6 mm Bohrung in der XPS-Wand nach außen zum 12-V-Netzteil.</text><text x="30.0" y="446.0" class="s" text-anchor="start">Netzteil + Schalt-Steckdose bleiben AUSSEN und trocken.</text><text x="690.0" y="75.0" class="t b" text-anchor="start">E  Rückwand von außen (Kabelschlitze, ca. 1:2)</text><polygon points="1046.0,690.0 1013.0,690.0 1013.0,651.5 969.0,651.5 969.0,690.0 837.0,690.0 837.0,651.5 793.0,651.5 793.0,690.0 760.0,690.0 760.0,178.5 875.5,178.5 875.5,211.5 930.5,211.5 930.5,178.5 1046.0,178.5" fill="url(#foam)" stroke="#1d2b36" stroke-width="1.4" stroke-linejoin="round" /><rect x="892.0" y="255.5" width="22.0" height="22.0" fill="none" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/><text x="889.2" y="270.5" class="s" text-anchor="end" fill="#c0392b">Sensortasche (innen)</text><text x="991.0" y="643.5" class="s" text-anchor="middle">80x70</text><circle cx="991.0" cy="677.9" r="7" fill="#222"/><text x="815.0" y="643.5" class="s" text-anchor="middle">80x70</text><circle cx="815.0" cy="677.9" r="7" fill="#222"/><text x="903.0" y="227.5" class="s" text-anchor="middle">100x60</text><circle cx="903.0" cy="189.5" r="7" fill="#222"/><line x1="760.0" y1="716.0" x2="1046.0" y2="716.0" stroke="#1d2b36" stroke-width="1"/><line x1="760.0" y1="716.0" x2="1046.0" y2="716.0" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="903.0" y="712.0" class="s" text-anchor="middle">520</text><line x1="740.0" y1="690.0" x2="740.0" y2="178.5" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="736.0" y="434.2" class="s" text-anchor="middle" transform="rotate(-90 736.0 434.2)">930</text><text x="690.0" y="750.0" class="s" text-anchor="start">Kabelschlitze sind offene Nuten am Rand: Wand wird über die bereits</text><text x="690.0" y="766.0" class="s" text-anchor="start">angeschlossenen Kabel gestülpt - nichts abmontieren.</text><text x="690.0" y="782.0" class="s" text-anchor="start">Position/Breite nach dem tatsächlichen Kabelverlauf anpassen.</text><text x="690.0" y="798.0" class="s" text-anchor="start">Restspalt mit Schaumstoffstreifen / Bürstendichtung schließen</text><text x="690.0" y="814.0" class="s" text-anchor="start">(Nut ca. 10 mm breiter als Kabelbündel, Streifen eindrücken).</text><text x="690.0" y="830.0" class="s" text-anchor="start">Schwarze Punkte = Kabel (AC, MC4/PV, Sonstiges).</text><text x="30.0" y="490.0" class="t b" text-anchor="start">F  Wandecke (Draufsicht, ca. 1.5:1)</text><rect x="70.0" y="530.0" width="225.0" height="45.0" fill="url(#xps)" stroke="#1d2b36" stroke-width="1.2" /><rect x="70.0" y="575.0" width="45.0" height="135.0" fill="url(#xps)" stroke="#1d2b36" stroke-width="1.2" /><rect x="65.5" y="525.5" width="229.5" height="4.5" fill="#c8c8c8" stroke="#555" stroke-width="1" /><rect x="65.5" y="525.5" width="4.5" height="184.5" fill="#c8c8c8" stroke="#555" stroke-width="1" /><text x="325.0" y="560.0" class="s" text-anchor="start">Stumpfstoß: Seitenwand zwischen Vorder-/Rückwand,</text><text x="325.0" y="576.0" class="s" text-anchor="start">XPS-tauglicher Kleber (lösemittelfrei), außen Alu-Klebeband</text><text x="325.0" y="592.0" class="s" text-anchor="start">über die Kante (verhindert Aufspreizen, dichtet ab).</text><text x="325.0" y="608.0" class="s" text-anchor="start">Innen bleibt alles glatt - Luftspalt 50 mm durchgehend.</text><text x="30.0" y="740.0" class="t b" text-anchor="start">G  Deckel-System (Schnitt, ca. 1.6:1)</text><rect x="80.0" y="876.0" width="48.0" height="144.0" fill="url(#xps)" stroke="#1d2b36" stroke-width="1.2" /><rect x="129.6" y="876.0" width="160.0" height="48.0" fill="url(#xps)" stroke="#1d2b36" stroke-width="1.2" /><rect x="80.0" y="828.0" width="209.6" height="48.0" fill="url(#xps)" stroke="#1d2b36" stroke-width="1.2" /><rect x="78.4" y="872.8" width="51.2" height="3.2" fill="#444" stroke="#222" stroke-width="1" /><rect x="68.8" y="818.4" width="3.0" height="201.6" fill="#8e44ad" stroke="#5b2c6f" stroke-width="1" /><rect x="68.8" y="818.4" width="220.8" height="3.0" fill="#8e44ad" stroke="#5b2c6f" stroke-width="1" /><text x="184.0" y="904.0" class="s" text-anchor="middle">Stopfen 30 mm</text><text x="184.0" y="856.0" class="s" text-anchor="middle">Deckelplatte 30 mm</text><text x="86.4" y="972.0" class="s" text-anchor="start" transform="rotate(-90 86.4 972.0)">Wand</text><text x="336.0" y="796.0" class="s" text-anchor="start">Stopfen: 1 mm Spiel im Wandring, schließt den</text><text x="336.0" y="813.0" class="s" text-anchor="start">Luftspalt oben, Deckel kann nicht verrutschen.</text><text x="336.0" y="830.0" class="s" text-anchor="start">Dichtband (selbstklebend, ca. 3 mm, schwarz)</text><text x="336.0" y="847.0" class="s" text-anchor="start">umlaufend auf der Wandoberkante.</text><text x="336.0" y="864.0" class="s" text-anchor="start">Deckelplatte: 30 mm Überstand rundum (Regen).</text><text x="336.0" y="881.0" class="s" text-anchor="start" fill="#8e44ad">Klettband/Spanngurt 25 mm (violett): 2 Schlaufen</text><text x="336.0" y="898.0" class="s" text-anchor="start" fill="#8e44ad">um Box und Boden.</text><text x="336.0" y="915.0" class="s" text-anchor="start">-> Deckel abnehmen: Klettband öffnen, Deckel</text><text x="336.0" y="932.0" class="s" text-anchor="start">hochheben. Fertig.</text><rect x="10.0" y="1088.0" width="1280.0" height="52.0" fill="none" stroke="#1d2b36" stroke-width="1.5" /><line x1="1090.0" y1="1088.0" x2="1090.0" y2="1140.0" stroke="#1d2b36" stroke-width="1"/><text x="20.0" y="1110.0" class="h" text-anchor="start">04 Details</text><text x="20.0" y="1130.0" class="s" text-anchor="start">Lüfter-Einbau, Kabelschlitze, Ecke, Deckel</text><text x="1100.0" y="1108.0" class="t b" text-anchor="start">Zendure Winterbox</text><text x="1100.0" y="1124.0" class="s" text-anchor="start">Blatt 4/5 - Masse in mm</text><text x="1100.0" y="1136.0" class="s" text-anchor="start">XPS 30 mm | Massstab siehe Zeichnung</text></svg>