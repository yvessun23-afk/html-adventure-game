<rect width="100%" height="100%" fill="#ffffff"/><text x="20.0" y="32.0" class="h" text-anchor="start">3  SCHNITTE B-B und C-C (waagerecht) - Wandaufbau, Luftspalte, Sensortasche</text><text x="20.0" y="52.0" class="s" text-anchor="start">Draufsicht auf Schnittebene. Schraffur = XPS-Dämmung 30 mm. Hinten (y=0) = Rückwand mit Kabelschlitzen.</text><rect x="180.0" y="130.0" width="468.0" height="27.0" fill="url(#xps)" stroke="#1d2b36" stroke-width="1.2" /><rect x="180.0" y="481.0" width="468.0" height="27.0" fill="url(#xps)" stroke="#1d2b36" stroke-width="1.2" /><rect x="180.0" y="157.0" width="27.0" height="324.0" fill="url(#xps)" stroke="#1d2b36" stroke-width="1.2" /><rect x="621.0" y="157.0" width="27.0" height="108.0" fill="url(#xps)" stroke="#1d2b36" stroke-width="1.2" /><rect x="621.0" y="373.0" width="27.0" height="108.0" fill="url(#xps)" stroke="#1d2b36" stroke-width="1.2" /><rect x="625.5" y="265.0" width="22.5" height="108.0" fill="#3a4652" stroke="#111" stroke-width="1" /><rect x="648.0" y="251.5" width="6.3" height="135.0" fill="#b03a2e" stroke="#7b241c" stroke-width="1" /><rect x="252.0" y="202.0" width="324.0" height="234.0" fill="#f6d9b8" stroke="#555" stroke-width="1.3" /><text x="414.0" y="226.0" class="t b" text-anchor="middle">Hyper 2000</text><rect x="396.0" y="146.2" width="36.0" height="10.8" fill="#ffffff" stroke="#333" stroke-width="1" /><rect x="397.8" y="148.9" width="32.4" height="8.1" fill="#f39c12" stroke="#7a4a00" stroke-width="1" /><circle cx="414.0" cy="117.4" r="10" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="414.0" y="121.4" class="s b" text-anchor="middle" fill="#c0392b">2</text><text x="432.0" y="121.0" class="s" text-anchor="start">Aqara-Sensor in Tasche 40x40x12</text><line x1="229.5" y1="319.0" x2="729.0" y2="319.0" stroke="#d1400a" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrw)"/><polyline points="229.5,467.5 229.5,170.5" fill="none" stroke="#0a7bd1" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arr)"/><polyline points="598.5,170.5 598.5,310.0" fill="none" stroke="#0a7bd1" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arr)"/><line x1="180.0" y1="536.0" x2="648.0" y2="536.0" stroke="#1d2b36" stroke-width="1"/><line x1="180.0" y1="536.0" x2="648.0" y2="536.0" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="414.0" y="532.0" class="s" text-anchor="middle">520</text><line x1="207.0" y1="558.0" x2="252.0" y2="558.0" stroke="#1d2b36" stroke-width="1"/><line x1="207.0" y1="558.0" x2="252.0" y2="558.0" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="229.5" y="554.0" class="s" text-anchor="middle">50</text><line x1="252.0" y1="558.0" x2="576.0" y2="558.0" stroke="#1d2b36" stroke-width="1"/><line x1="252.0" y1="558.0" x2="576.0" y2="558.0" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="414.0" y="554.0" class="s" text-anchor="middle">360</text><line x1="576.0" y1="558.0" x2="621.0" y2="558.0" stroke="#1d2b36" stroke-width="1"/><line x1="576.0" y1="558.0" x2="621.0" y2="558.0" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="598.5" y="554.0" class="s" text-anchor="middle">50</text><line x1="144.0" y1="130.0" x2="144.0" y2="508.0" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="140.0" y="319.0" class="s" text-anchor="middle" transform="rotate(-90 140.0 319.0)">420</text><line x1="688.0" y1="157.0" x2="688.0" y2="202.0" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="684.0" y="179.5" class="s" text-anchor="middle" transform="rotate(-90 684.0 179.5)">50</text><line x1="688.0" y1="202.0" x2="688.0" y2="436.0" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="684.0" y="319.0" class="s" text-anchor="middle" transform="rotate(-90 684.0 319.0)">260</text><line x1="688.0" y1="436.0" x2="688.0" y2="481.0" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="684.0" y="458.5" class="s" text-anchor="middle" transform="rotate(-90 684.0 458.5)">50</text><text x="414.0" y="94.0" class="t b" text-anchor="middle">SCHNITT B-B auf Höhe z = 780 mm (Hyper, Abluft-Lüfter, Sensor)</text><text x="189.0" y="147.5" class="s" text-anchor="start">Rückwand 30</text><text x="189.0" y="498.5" class="s" text-anchor="start">Vorderwand 30</text><rect x="180.0" y="700.0" width="468.0" height="27.0" fill="url(#xps)" stroke="#1d2b36" stroke-width="1.2" /><rect x="180.0" y="1051.0" width="468.0" height="27.0" fill="url(#xps)" stroke="#1d2b36" stroke-width="1.2" /><rect x="180.0" y="727.0" width="27.0" height="108.0" fill="url(#xps)" stroke="#1d2b36" stroke-width="1.2" /><rect x="180.0" y="943.0" width="27.0" height="108.0" fill="url(#xps)" stroke="#1d2b36" stroke-width="1.2" /><rect x="180.0" y="835.0" width="22.5" height="108.0" fill="#3a4652" stroke="#111" stroke-width="1" /><rect x="173.7" y="821.5" width="6.3" height="135.0" fill="#b03a2e" stroke="#7b241c" stroke-width="1" /><rect x="621.0" y="727.0" width="27.0" height="324.0" fill="url(#xps)" stroke="#1d2b36" stroke-width="1.2" /><rect x="252.0" y="772.0" width="324.0" height="234.0" fill="#d4d9de" stroke="#555" stroke-width="1.3" /><text x="414.0" y="796.0" class="t b" text-anchor="middle">AB2000X</text><line x1="99.0" y1="889.0" x2="229.5" y2="889.0" stroke="#0a7bd1" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arr)"/><polyline points="229.5,889.0 229.5,737.8" fill="none" stroke="#0a7bd1" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arr)"/><polyline points="229.5,889.0 229.5,1040.2" fill="none" stroke="#0a7bd1" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arr)"/><line x1="180.0" y1="1106.0" x2="648.0" y2="1106.0" stroke="#1d2b36" stroke-width="1"/><line x1="180.0" y1="1106.0" x2="648.0" y2="1106.0" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="414.0" y="1102.0" class="s" text-anchor="middle">520</text><line x1="207.0" y1="1128.0" x2="252.0" y2="1128.0" stroke="#1d2b36" stroke-width="1"/><line x1="207.0" y1="1128.0" x2="252.0" y2="1128.0" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="229.5" y="1124.0" class="s" text-anchor="middle">50</text><line x1="252.0" y1="1128.0" x2="576.0" y2="1128.0" stroke="#1d2b36" stroke-width="1"/><line x1="252.0" y1="1128.0" x2="576.0" y2="1128.0" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="414.0" y="1124.0" class="s" text-anchor="middle">360</text><line x1="576.0" y1="1128.0" x2="621.0" y2="1128.0" stroke="#1d2b36" stroke-width="1"/><line x1="576.0" y1="1128.0" x2="621.0" y2="1128.0" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="598.5" y="1124.0" class="s" text-anchor="middle">50</text><line x1="144.0" y1="700.0" x2="144.0" y2="1078.0" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="140.0" y="889.0" class="s" text-anchor="middle" transform="rotate(-90 140.0 889.0)">420</text><line x1="688.0" y1="727.0" x2="688.0" y2="772.0" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="684.0" y="749.5" class="s" text-anchor="middle" transform="rotate(-90 684.0 749.5)">50</text><line x1="688.0" y1="772.0" x2="688.0" y2="1006.0" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="684.0" y="889.0" class="s" text-anchor="middle" transform="rotate(-90 684.0 889.0)">260</text><line x1="688.0" y1="1006.0" x2="688.0" y2="1051.0" stroke="#1d2b36" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="684.0" y="1028.5" class="s" text-anchor="middle" transform="rotate(-90 684.0 1028.5)">50</text><text x="414.0" y="664.0" class="t b" text-anchor="middle">SCHNITT C-C auf Höhe z = 110 mm (unterste AB2000X, Zuluft-Lüfter)</text><text x="189.0" y="717.5" class="s" text-anchor="start">Rückwand 30</text><text x="189.0" y="1068.5" class="s" text-anchor="start">Vorderwand 30</text><text x="780.0" y="170.0" class="t b" text-anchor="start">Aufbau der Wand</text><text x="780.0" y="192.0" class="s" text-anchor="start">- XPS 30 mm, glatte Außenhaut, geschlossenzellig (nimmt kein Wasser auf)</text><text x="780.0" y="214.0" class="s" text-anchor="start">- Ecken stumpf gestoßen: mit XPS-tauglichem Kleber verkleben</text><text x="780.0" y="236.0" class="s" text-anchor="start">  und außen mit Alu-Klebeband (Kantenschutz + Dampfbremse) überkleben</text><text x="780.0" y="258.0" class="s" text-anchor="start">- Innen bleibt ein durchgehender Luftspalt von 50 mm rundum</text><text x="780.0" y="280.0" class="t b" text-anchor="start">Sensortasche (2)</text><text x="780.0" y="302.0" class="s" text-anchor="start">- Aqara Rechteck-Sensor 36x36x9 mm liegt in 40x40x12 mm Tasche</text><text x="780.0" y="324.0" class="s" text-anchor="start">  in der Rückwand-Innenfläche, ca. 30 mm unter Hyper-Oberkante</text><text x="780.0" y="346.0" class="s" text-anchor="start">- Nicht im direkten Luftstrom -> misst Boxluft statt Lüfterzug</text><text x="780.0" y="368.0" class="s" text-anchor="start">- Zigbee funkt durch XPS problemlos; CR2032 bleibt im Warmen</text><text x="780.0" y="390.0" class="t b" text-anchor="start">Lüfter</text><text x="780.0" y="412.0" class="s" text-anchor="start">- 120x120x25 mm, Öffnung 121x121 mm, Presspassung + Alu-Band</text><text x="780.0" y="434.0" class="s" text-anchor="start">- Zuluft links unten (C-C), Abluft rechts oben (B-B)</text><rect x="10.0" y="1138.0" width="1230.0" height="52.0" fill="none" stroke="#1d2b36" stroke-width="1.5" /><line x1="1040.0" y1="1138.0" x2="1040.0" y2="1190.0" stroke="#1d2b36" stroke-width="1"/><text x="20.0" y="1160.0" class="h" text-anchor="start">03 Schnitte B-B / C-C</text><text x="20.0" y="1180.0" class="s" text-anchor="start">Horizontalschnitte, M ca. 1:1</text><text x="1050.0" y="1158.0" class="t b" text-anchor="start">Zendure Winterbox</text><text x="1050.0" y="1174.0" class="s" text-anchor="start">Blatt 3/5 - Masse in mm</text><text x="1050.0" y="1186.0" class="s" text-anchor="start">XPS 30 mm | Massstab siehe Zeichnung</text></svg>